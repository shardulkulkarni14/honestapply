name: CLA Assistant

# Self-hosted CLA signing — no external hosted app. First-time contributors sign
# the Contributor License Agreement (CLA.md) on their first PR by posting the signing
# phrase as a comment; the bot records the signature in a file on a dedicated branch.
on:
  # Re-run when the PR is opened or updated so the CLA status is re-checked.
  pull_request_target:
    types: [opened, synchronize]
  # Let a contributor sign (or re-check) by commenting on the PR.
  issue_comment:
    types: [created]

# pull_request_target / issue_comment run with the base-repo token, so these grant
# the bot what it needs: write the signatures file + branch (contents), post the
# status comment (pull-requests), and set the CLA commit status (statuses).
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    # Only act on real PRs: either a PR event, or a comment on a PR (not a plain issue).
    if: >
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null) ||
      github.event_name == 'pull_request_target'
    steps:
      - name: CLA Assistant
        # Skip for the recheck/sign comment handling unless it's a PR event or a
        # relevant comment, to avoid acting on unrelated chatter.
        if: >
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          # Built-in token: posts PR comments/statuses and (with contents: write above)
          # commits the signatures file to the signature branch in THIS repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional PAT. Only needed if the signatures are stored in a DIFFERENT repo,
          # or if branch protection on the signature branch rejects the GITHUB_TOKEN.
          # Create a classic PAT with `repo` scope and add it as the repository secret
          # CLA_SIGNATURES_TOKEN; otherwise this stays empty and GITHUB_TOKEN is used.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          # Where signatures are stored, on a dedicated branch (not main).
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          # The CLA contributors are agreeing to.
          path-to-document: https://github.com/shardulkulkarni14/honestapply/blob/main/CLA.md
          # The exact phrase a contributor comments to sign.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have signed the CLA. Thank you.
          # Bots and the maintainer don't need to sign.
          allowlist: dependabot[bot],github-actions[bot]
