# Pre-written answers for common application questions.
# The apply orchestrator fuzzy-matches question text against these keys.
#
# THIS IS A TEMPLATE: replace every value with YOUR truthful details before
# running the apply stage — these strings get typed into real forms.
# (`honestapply init` copies this to config/answers.yaml, which is gitignored.)

# ── Personal info ──────────────────────────────────────────────────────────────
personal_info:
  full_name: "Alex Example"
  first_name: "Alex"
  last_name: "Example"
  email: "alex@example.com"
  phone: "+49 100 0000000"
  location: "Berlin, Germany"
  city: "Berlin"
  country: "Germany"
  linkedin: "https://www.linkedin.com/in/alex-example"
  github: "https://github.com/alex-example"
  portfolio: ""
