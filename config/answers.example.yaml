# ── Self-identification / EEO ──────────────────────────────────────────────────
self_identification:
  gender: "Prefer not to say"
  race_ethnicity: "Prefer not to say"
  veteran_status: "I am not a protected veteran"
  disability_status: "I don't wish to answer"
  # If a form uses coded values you can override them here, e.g.:
  # gender_code: "3"   # 3 = "Prefer not to answer" on OFCCP forms

# ── Salary rules ───────────────────────────────────────────────────────────────
# The orchestrator reads this block to decide what to type/select.
salary_rules:
  free_text: "Open to discussion based on total compensation and scope"
  numeric_required_with_visible_range: "enter the high end of the visible range"
  numeric_required_no_range: "use role-specific default from profile.salary_expectation"
  range_selector: "profile.salary_expectation.min to profile.salary_expectation.max"
  currency: "EUR"
  note: >
    Always use your home currency unless the role is explicitly priced in another.
    For foreign-currency roles, convert using approximate market rate at time of application.

