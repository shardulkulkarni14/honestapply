  # ───────────────────────────────────────────────────────────────────────────
  # SmartRecruiters — large traditional/industrial German employers live here
  # (Bosch, Continental, …) rather than Greenhouse/Lever/Ashby.
  #   token   = the SmartRecruiters company identifier
  #             (from api.smartrecruiters.com/v1/companies/<token>/postings)
  #   country = ISO code to bias the board (default "de"; set "" for all countries)
  #   q       = optional keyword filter
  # ───────────────────────────────────────────────────────────────────────────
  - {name: Bosch, ats: smartrecruiters, token: BoschGroup, country: de}        # ~970 DE jobs
  - {name: Continental, ats: smartrecruiters, token: Continental, country: de} # ~160 DE
  - {name: CHECK24, ats: smartrecruiters, token: CHECK24, country: de}         # ~215 DE
  - {name: Delivery Hero, ats: smartrecruiters, token: DeliveryHero, country: de}
  - {name: Auto1 Group, ats: smartrecruiters, token: Auto1, country: de}       # ~162 DE (Berlin used-car platform)

  # More German scaleups on Greenhouse (validated DE job volume):
  - {name: Gympass/Wellhub, ats: greenhouse, token: gympass}                   # ~18 DE
  - {name: Staffbase, ats: greenhouse, token: staffbase}                       # ~11 DE (Chemnitz/Berlin)
  - {name: Grover, ats: greenhouse, token: grover}                             # ~10 DE (Berlin tech rental)
  - {name: Moonfare, ats: greenhouse, token: moonfare}                         # ~9 DE (Berlin fintech)
  - {name: emnify, ats: greenhouse, token: emnify}                             # ~7 DE (Berlin IoT)

  # ───────────────────────────────────────────────────────────────────────────
  # Workday — per-tenant public career sites (*.myworkdayjobs.com). Each needs:
  #   host:   the Workday host  (e.g. acme.wd3.myworkdayjobs.com)
  #   site:   the career-site path segment (e.g. External, AcmeCareers)
  #   tenant: optional; defaults to the host's first sub-domain label
  # Find host/site from the company's "Search Jobs" page URL. The fetcher is
  # validated; uncomment + replace with a verified tenant (slugs vary per company):
  # - {name: ExampleCo, ats: workday, token: exampleco,
  #    host: exampleco.wd3.myworkdayjobs.com, site: External}
