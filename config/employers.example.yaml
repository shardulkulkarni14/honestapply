# honestapply employers configuration — copy this file to employers.yaml and edit.
# Each entry tells honestapply how to fetch jobs directly from a company's ATS board.
#
# Fields:
#   name  : human-readable company name
#   ats   : greenhouse | lever | ashby
#   token : the board slug / org slug used in the ATS API URL
#           Leave blank and honestapply will guess `name.lower().replace(" ", "")`.
#
# How to find a company's board token:
#   Greenhouse : visit job-boards.greenhouse.io/<token> or boards.greenhouse.io/<token>.
#                The token is the path segment after the domain.
#                API: GET https://boards-api.greenhouse.io/v1/boards/<token>/jobs
#   Lever      : visit jobs.lever.co/<token> — the path segment is the token.
#                API: GET https://api.lever.co/v0/postings/<token>?mode=json
#   Ashby      : visit jobs.ashbyhq.com/<token> — the path segment is the token
#                (case-insensitive; some companies use their domain, e.g. taxfix.com).
#                API: GET https://api.ashbyhq.com/posting-api/job-board/<token>
#
# ─────────────────────────────────────────────────────────────────────────────
# US / GLOBAL employers (Greenhouse + Ashby) — verified May 2026
# ─────────────────────────────────────────────────────────────────────────────
employers:
  # --- Greenhouse (US/Global) ---
  - name: Anthropic
    ats: greenhouse
    token: anthropic   # verified: ~392 jobs

  - name: Stripe
    ats: greenhouse
    token: stripe      # verified: ~496 jobs

  - name: Figma
    ats: greenhouse
    token: figma       # verified: ~159 jobs

  - name: Vercel
    ats: greenhouse
    token: vercel      # verified: ~79 jobs

  # --- Ashby (US/Global) ---
  - name: Notion
    ats: ashby
    token: notion      # verified: ~130 jobs

  - name: Linear
    ats: ashby
    token: linear      # verified: ~23 jobs

  - name: Cursor
    ats: ashby
    token: cursor      # verified: ~86 jobs (Cursor / Anysphere)

  - name: Ramp
    ats: ashby
    token: ramp        # verified: ~121 jobs

