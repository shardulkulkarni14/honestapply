<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>honestapply</title>
<style>
  :root{
    --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f0f2f6;
    --ink:#161b26; --ink-2:#555f70; --muted:#8a93a3; --border:#e4e8ef;
    --accent:#4f46e5; --accent-soft:#eef0fe;
    --good:#15863f; --info:#2563eb; --warning:#b45c09; --critical:#d22f2f; --neutral:#7b8595;
    --radius:14px; --shadow:0 1px 2px rgba(20,25,40,.04),0 4px 16px rgba(20,25,40,.05);
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#0e1016; --surface:#161a22; --surface-2:#1d222c;
    --ink:#e9edf4; --ink-2:#a3adbd; --muted:#6c7686; --border:#272d39;
    --accent:#818cf8; --accent-soft:#1e2140;
    --good:#2bb561; --info:#4b8ef7; --warning:#e0912f; --critical:#f26d6d; --neutral:#5d6778;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 18px rgba(0,0,0,.28);
  }}
  :root[data-theme="dark"]{
    --bg:#0e1016; --surface:#161a22; --surface-2:#1d222c;
    --ink:#e9edf4; --ink-2:#a3adbd; --muted:#6c7686; --border:#272d39;
    --accent:#818cf8; --accent-soft:#1e2140;
    --good:#2bb561; --info:#4b8ef7; --warning:#e0912f; --critical:#f26d6d; --neutral:#5d6778;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 18px rgba(0,0,0,.28);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
  /* header */
  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .brand{font-size:22px;font-weight:750;letter-spacing:-.02em}
  .brand .dot{color:var(--accent)}
  .sub{color:var(--ink-2);font-size:13.5px}
  .spacer{flex:1}
  .live{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-size:12.5px}
  .live .pulse{width:8px;height:8px;border-radius:50%;background:var(--good);
    box-shadow:0 0 0 0 rgba(21,134,63,.5);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(21,134,63,.45)}70%{box-shadow:0 0 0 7px rgba(21,134,63,0)}100%{box-shadow:0 0 0 0 rgba(21,134,63,0)}}
  .btn{border:1px solid var(--border);background:var(--surface);color:var(--ink);
    padding:7px 12px;border-radius:10px;font-size:13px;cursor:pointer;font-family:inherit}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn:disabled{opacity:.5;cursor:default;border-color:var(--border);color:var(--ink-2)}
  /* run bar */
  .runbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .runbtns{display:flex;gap:8px;flex-wrap:wrap}
  .btn.run{font-weight:600}
  .runstatus{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);
    border-radius:10px;padding:6px 12px;font-size:13px;box-shadow:var(--shadow)}
  .runstatus[hidden]{display:none}
  .spin{width:13px;height:13px;border:2px solid var(--border);border-top-color:var(--accent);
    border-radius:50%;animation:spin 1s linear infinite;flex:0 0 auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .logln{color:var(--muted);font-family:var(--mono);font-size:11px;max-width:420px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .btn.stop{color:var(--critical);border-color:color-mix(in srgb,var(--critical) 40%,transparent)}
  body.present .runbar{display:none}
  /* KPI tiles */
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:15px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .tile .n{font-size:30px;font-weight:760;letter-spacing:-.02em;line-height:1.05}
  .tile .l{font-size:12.5px;color:var(--ink-2);margin-top:3px}
  .tile .bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
  .tile.good .bar{background:var(--good)} .tile.info .bar{background:var(--info)}
  .tile.warning .bar{background:var(--warning)} .tile.critical .bar{background:var(--critical)}
  .tile.good .n{color:var(--good)} .tile.critical .n{color:var(--critical)}
  .tile.warning .n{color:var(--warning)}
  /* layout: funnel + activity */
  .grid{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-bottom:18px}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:16px 18px}
  .panel h2{margin:0 0 2px;font-size:14px;font-weight:700;letter-spacing:-.01em}
  .panel .hint{color:var(--muted);font-size:12px;margin:0 0 14px}
  /* funnel bars */
  .funnel{display:flex;flex-direction:column;gap:11px}
  .frow{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:10px}
  .frow .fl{font-size:13px;color:var(--ink-2)}
  .ftrack{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
  .ffill{height:100%;border-radius:7px;background:var(--accent);min-width:3px;transition:width .5s ease}
  .frow.applied .ffill{background:var(--info)} .frow.in_process .ffill{background:var(--warning)}
  .frow.offer .ffill{background:var(--good)}
  .frow .fn{font-variant-numeric:tabular-nums;font-weight:680;font-size:14px;min-width:54px;text-align:right}
  .conv{font-size:11px;color:var(--muted);margin-left:6px}
  /* activity feed */
  .feed{display:flex;flex-direction:column;gap:2px;max-height:320px;overflow:auto}
  .ev{display:flex;gap:10px;padding:9px 2px;border-bottom:1px solid var(--border)}
  .ev:last-child{border-bottom:none}
  .ev .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:0 0 auto;background:var(--neutral)}
  .ev.good .dot{background:var(--good)} .ev.info .dot{background:var(--info)}
  .ev.warning .dot{background:var(--warning)} .ev.critical .dot{background:var(--critical)}
  .ev.accent .dot{background:var(--accent)}
  .ev .txt{flex:1;min-width:0}
  .ev .line{font-size:13.5px}
  .ev .meta{font-size:11.5px;color:var(--muted);margin-top:1px;display:flex;gap:8px;flex-wrap:wrap}
  .src{border:1px solid var(--border);border-radius:6px;padding:0 6px;font-size:10.5px;color:var(--ink-2)}
  .src.email{color:var(--info);border-color:color-mix(in srgb,var(--info) 40%,transparent)}
  .src.you,.src.dashboard{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
  /* table */
  .toolbar{display:flex;align-items:center;gap:10px;margin:4px 0 10px}
  #q{flex:1;max-width:420px;border:1px solid var(--border);background:var(--surface);color:var(--ink);
    border-radius:10px;padding:9px 12px;font-size:14px;font-family:inherit}
  #q:focus{outline:none;border-color:var(--accent)}
  .count{color:var(--muted);font-size:12.5px}
  .tablewrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
    font-weight:650;position:sticky;top:0;background:var(--surface);z-index:1}
  tr:last-child td{border-bottom:none}
  td.co{font-weight:640} td.role{color:var(--ink-2)}
  .pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;
    font-size:12px;font-weight:600;border:1px solid transparent;white-space:nowrap}
  .pill.accent{background:var(--accent-soft);color:var(--accent)}
  .pill.good{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
  .pill.info{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info)}
  .pill.warning{background:color-mix(in srgb,var(--warning) 16%,transparent);color:var(--warning)}
  .pill.critical{background:color-mix(in srgb,var(--critical) 14%,transparent);color:var(--critical)}
  .pill.neutral{background:var(--surface-2);color:var(--ink-2)}
  .links{display:flex;gap:7px;flex-wrap:wrap}
  .lnk{font-size:11.5px;color:var(--ink-2);border:1px solid var(--border);border-radius:6px;padding:1px 6px}
  .lnk:hover{border-color:var(--accent);color:var(--accent);text-decoration:none}
  .none{color:var(--muted)}
  .nextline{font-size:11.5px;color:var(--info);margin-top:3px}
  .nextline.past{color:var(--critical)}
  .empty{color:var(--muted);text-align:center;padding:26px}
  /* present mode: hide the aggregate numbers for a shoulder-surf-safe view */
  body.present .kpis,body.present .panel.funnel-panel,body.present .count{display:none}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);
    color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;
    transition:opacity .2s}
  #toast.show{opacity:.96}
  @media (max-width:860px){ .kpis{grid-template-columns:repeat(2,1fr)} .grid{grid-template-columns:1fr}
    .c-loc,.c-files{display:none} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="brand">honestapply<span class="dot">.</span></span>
    <span class="sub" id="subtitle">loading…</span>
    <span class="spacer"></span>
    <span class="live"><span class="pulse"></span><span id="livelabel">live</span></span>
    <button class="btn" onclick="togglePresent()" id="presentBtn">🙈 Present</button>
    <button class="btn" onclick="refreshAll()">↻ Refresh</button>
  </header>

  <!-- run control -->
  <section class="runbar">
    <div class="runbtns">
      <button class="btn run" onclick="startRun('discover')">🔎 Find jobs</button>
      <button class="btn run" onclick="startRun('prepare')">⚙️ Prepare</button>
      <button class="btn run" onclick="startRun('apply_dry')" title="Dry-run: fills forms but never submits">📝 Apply (dry-run)</button>
    </div>
    <div class="runstatus" id="runstatus" hidden></div>
  </section>

  <!-- headline numbers -->
  <section class="kpis" id="kpis"></section>

  <section class="grid">
    <div class="panel funnel-panel">
      <h2>Your pipeline</h2>
      <p class="hint">Where every job stands right now — honestapply sources widely and applies selectively.</p>
      <div class="funnel" id="funnel"></div>
    </div>
    <div class="panel">
      <h2>Recent activity</h2>
      <p class="hint">What just happened — updated live.</p>
      <div class="feed" id="feed"><div class="empty">loading…</div></div>
    </div>
  </section>

  <div class="toolbar">
    <input id="q" placeholder="Search company, role, location…" autocomplete="off" oninput="renderTable()">
    <span class="count" id="count"></span>
  </div>
  <div class="tablewrap">
    <table>
      <colgroup><col><col><col class="c-loc"><col><col class="num"><col><col class="c-files"></colgroup>
      <thead><tr>
        <th>Company</th><th>Role</th><th class="c-loc">Location</th><th>Status</th>
        <th class="num">Fit</th><th>Applied</th><th class="c-files">Files</th>
      </tr></thead>
      <tbody id="rows"><tr><td colspan="7" class="empty">loading…</td></tr></tbody>
    </table>
  </div>
</div>
<div id="toast"></div>

<script>
const esc = s => (s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DATA = [];

// --- plain-language mapping for raw statuses -------------------------------
const LABEL = {
  discovered:'Found', enriched:'Preparing', scored:'Preparing', tailored:'Preparing',
  covered:'Ready', ready_to_apply:'Ready', applied:'Applied', dry_run_completed:'Applied (test)',
  screening:'Screening', interviewing:'Interviewing', offer:'Offer 🎉', rejected:'Not selected',
  ghosted:'No response', needs_human:'Needs you', failed:'Failed',
  skipped_low_fit:'Skipped', skipped_company_cap:'Skipped',
};
const TONE = {
  offer:'good', interviewing:'info', screening:'info', applied:'accent', dry_run_completed:'accent',
  needs_human:'warning', rejected:'critical', failed:'critical',
  ghosted:'neutral', skipped_low_fit:'neutral', skipped_company_cap:'neutral',
};
const lbl = s => LABEL[s] || (s||'').replace(/_/g,' ');
const tone = s => TONE[s] || 'neutral';

function rel(iso){
  if(!iso) return '';
  const d=new Date(iso), now=new Date(), s=(now-d)/1000;
  if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  if(s<172800) return 'yesterday';
  if(s<604800) return Math.floor(s/86400)+'d ago';
  return d.toLocaleDateString();
}

// --- KPIs + funnel ---------------------------------------------------------
async function loadFunnel(){
  const f = await (await fetch('/api/funnel')).json();
  const bs = f.by_status||{};
  const g = (...k)=>k.reduce((a,x)=>a+(bs[x]||0),0);
  const sent = g('applied','dry_run_completed','screening','interviewing','offer','rejected','ghosted');
  const kpis = [
    {n:f.total, l:'Jobs found', t:''},
    {n:sent, l:'Applications sent', t:'accent'},
    {n:g('screening','interviewing'), l:'In process', t:'info'},
    {n:g('offer'), l:'Offers', t:'good'},
    {n:g('needs_human'), l:'Needs you', t:'warning'},
  ];
  document.getElementById('kpis').innerHTML = kpis.map(k=>
    `<div class="tile ${k.t}"><div class="bar"></div><div class="n">${k.n.toLocaleString()}</div><div class="l">${k.l}</div></div>`).join('');

  const max = Math.max(1, ...f.stages.map(s=>s.count));
  document.getElementById('funnel').innerHTML = f.stages.map((s,i)=>{
    const prev = i>0 ? f.stages[i-1].count : null;
    const conv = (prev && prev>0) ? `<span class="conv">${Math.round(s.count/prev*100)}%</span>` : '';
    const w = Math.max(2, s.count/max*100);
    return `<div class="frow ${s.key}"><div class="fl">${esc(s.label)}</div>`
      + `<div class="ftrack"><div class="ffill" style="width:${w}%"></div></div>`
      + `<div class="fn">${s.count.toLocaleString()}${conv}</div></div>`;
  }).join('');
}

// --- activity feed ---------------------------------------------------------
function sentence(e){
  const co = esc(e.company||'a company'); const role = e.title? ` · ${esc(e.title)}`:'';
  switch(e.to){
    case 'applied': return `Applied to <b>${co}</b>${role}`;
    case 'dry_run_completed': return `Prepared & test-filled <b>${co}</b>`;
    case 'screening': return `Screening started — <b>${co}</b>`;
    case 'interviewing': return `Interview — <b>${co}</b>`;
    case 'offer': return `🎉 Offer from <b>${co}</b>`;
    case 'rejected': return `Not selected — <b>${co}</b>`;
    case 'ghosted': return `No response — <b>${co}</b>`;
    case 'needs_human': return `Needs your input — <b>${co}</b>`;
    default: return `<b>${co}</b>: ${lbl(e.from)} → ${lbl(e.to)}`;
  }
}
const SRC = {pipeline:'auto', email:'email', dashboard:'you', human:'you'};
async function loadFeed(){
  const raw = await (await fetch('/api/activity?limit=60')).json();
  // Drop no-op churn (e.g. enriched->scored->tailored all read as "Preparing").
  const evs = raw.filter(e => lbl(e.from) !== lbl(e.to)).slice(0,40);
  const el = document.getElementById('feed');
  if(!evs.length){ el.innerHTML='<div class="empty">No activity yet.</div>'; return; }
  el.innerHTML = evs.map(e=>{
    const src = SRC[e.source]||e.source||'';
    return `<div class="ev ${tone(e.to)}"><div class="dot"></div><div class="txt">`
      + `<div class="line">${sentence(e)}</div>`
      + `<div class="meta"><span>${rel(e.at)}</span>`
      + (src?`<span class="src ${esc(e.source)}">${esc(src)}</span>`:'')
      + (e.note?`<span>· ${esc(e.note).slice(0,70)}</span>`:'')
      + `</div></div></div>`;
  }).join('');
}

// --- table -----------------------------------------------------------------
function statusSelect(r){
  const opts = Object.keys(LABEL).map(s=>`<option value="${s}"${s===r.status?' selected':''}>${lbl(s)}</option>`).join('');
  return `<select class="pill ${tone(r.status)}" style="border:none;cursor:pointer"
    onchange="setStatus(${r.job_id},this.value)">${opts}</select>`;
}
function fileLinks(r){
  const L=r.links||{}; const out=[];
  if(L.jd) out.push(`<a class="lnk" href="/jd/${r.job_id}" target="_blank">JD</a>`);
  if(L.resume) out.push(`<a class="lnk" href="/files/${r.job_id}/resume" target="_blank">CV</a>`);
  if(L.cover) out.push(`<a class="lnk" href="/files/${r.job_id}/cover" target="_blank">Cover</a>`);
  if(L.post_shot) out.push(`<a class="lnk" href="/files/${r.job_id}/post_shot" target="_blank">Proof</a>`);
  if(r.url) out.push(`<a class="lnk" href="${esc(r.url)}" target="_blank">Posting</a>`);
  return out.length? `<div class="links">${out.join('')}</div>` : '<span class="none">—</span>';
}
const TABLE_CAP = 80;
function renderTable(){
  const q=(document.getElementById('q').value||'').toLowerCase();
  const matched = DATA.filter(r=>!q || `${r.company} ${r.title} ${r.location} ${r.notes}`.toLowerCase().includes(q));
  const rows = matched.slice(0, TABLE_CAP);
  document.getElementById('count').textContent = matched.length>TABLE_CAP
    ? `showing ${TABLE_CAP} of ${matched.length} — search to narrow`
    : `${matched.length} shown`;
  const tb=document.getElementById('rows');
  if(!rows.length){ tb.innerHTML='<tr><td colspan="7" class="empty">No matching applications.</td></tr>'; return; }
  tb.innerHTML = rows.map(r=>{
    let nxt='';
    if(r.next_interview){ const past=r.next_interview_iso && new Date(r.next_interview_iso)<new Date();
      nxt=`<div class="nextline${past?' past':''}">📅 ${esc(r.next_interview)}</div>`; }
    return `<tr>
      <td class="co">${esc(r.company)}</td>
      <td class="role">${esc(r.title)}${nxt}</td>
      <td class="c-loc">${esc(r.location)||'<span class="none">—</span>'}</td>
      <td>${statusSelect(r)}</td>
      <td class="num">${r.score??'<span class="none">—</span>'}</td>
      <td>${esc(r.applied_at)||'<span class="none">—</span>'}</td>
      <td class="c-files">${fileLinks(r)}</td>
    </tr>`;
  }).join('');
}
async function loadTable(){
  DATA = await (await fetch('/api/applications')).json();
  document.getElementById('subtitle').textContent =
    `${DATA.length.toLocaleString()} applications tracked`;
  renderTable();
}
async function setStatus(job_id, status){
  try{
    await fetch('/api/jobs/'+job_id,{method:'PATCH',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({status})});
    toast('Updated'); refreshAll();
  }catch(e){ toast('Could not update'); }
}

// --- present mode + refresh ------------------------------------------------
function togglePresent(){
  document.body.classList.toggle('present');
  const on=document.body.classList.contains('present');
  document.getElementById('presentBtn').textContent = on?'👁 Show':'🙈 Present';
  try{ localStorage.setItem('ha_present', on?'1':''); }catch(e){}
}
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1600); }
// --- run control -----------------------------------------------------------
const STAGE_LABEL = {discover:'Finding jobs', prepare:'Preparing', apply_dry:'Applying (dry-run)'};
let runPoll = null;
async function startRun(stage){
  try{
    const r = await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stage})});
    if(r.status===409){ toast('A run is already in progress'); return; }
    if(!r.ok){ toast('Could not start the run'); return; }
    toast('Started: '+(STAGE_LABEL[stage]||stage)); pollRun();
  }catch(e){ toast('Could not start the run'); }
}
async function stopRun(){ try{ await fetch('/api/run/stop',{method:'POST'}); }catch(e){} pollRun(); }
function renderRun(s){
  const el = document.getElementById('runstatus');
  document.querySelectorAll('.btn.run').forEach(b=>b.disabled = s.running);
  if(s.running){
    const last = (s.log && s.log.length) ? s.log[s.log.length-1] : 'starting…';
    el.hidden=false;
    el.innerHTML = `<span class="spin"></span><b>${esc(STAGE_LABEL[s.stage]||s.stage)}…</b>`
      + `<span class="logln">${esc(last)}</span>`
      + `<button class="btn stop" onclick="stopRun()">Stop</button>`;
  }else{
    if(el.dataset.was==='1'){ toast(s.returncode===0?'Run finished ✓':'Run ended'); refreshAll(); }
    el.hidden=true; el.innerHTML='';
  }
  el.dataset.was = s.running?'1':'';
}
async function pollRun(){
  try{ renderRun(await (await fetch('/api/run')).json()); }catch(e){ return; }
  if(runPoll){ clearInterval(runPoll); runPoll=null; }
  runPoll = setInterval(async ()=>{
    let s; try{ s = await (await fetch('/api/run')).json(); }catch(e){ return; }
    renderRun(s);
    if(!s.running){ clearInterval(runPoll); runPoll=null; }
  }, 3000);
}

async function refreshAll(){
  await Promise.all([loadFunnel(), loadFeed(), loadTable()]);
}
try{ if(localStorage.getItem('ha_present')) togglePresent(); }catch(e){}
if(new URLSearchParams(location.search).get('present')==='1' && !document.body.classList.contains('present')) togglePresent();
