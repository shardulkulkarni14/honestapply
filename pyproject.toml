[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "honestapply"
version = "0.1.0"
description = "Autonomous, CLI-driven job-application pipeline: discover -> enrich -> score -> tailor -> cover-letter -> apply."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Shardul Kulkarni" }]

# Core deps: everything needed for CLI, config, and DB to work.
# Heavier / stage-specific deps live in optional-dependencies so each build
# phase can install only what it needs. `pip install -e ".[all]"` gets it all.
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "SQLAlchemy>=2.0.25",
    "alembic>=1.13",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "requests>=2.31",
]

[project.optional-dependencies]
# Stage 2 — resume rendering + supporting-document bundling
resume = [
    "Jinja2>=3.1",
    "weasyprint>=61.0",
    "pypdf>=4.0",  # docs-bundle merges transcripts/references into one upload
]
# Stages 1 & 2 (discover/enrich) — job boards + HTML parsing
discover = [
    "python-jobspy>=1.1.70",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
]
# Stages 3-5 — LLM providers
llm = [
    "anthropic>=0.40",
    "google-genai>=0.3",
    "openai>=1.40",
]
# Stage 7 — dashboard
dashboard = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff==0.16.1",
]
all = [
    "honestapply[resume,discover,llm,dashboard,dev]",
]

[project.scripts]
honestapply = "honestapply.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/honestapply"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Put the package source and the repo root on sys.path for the test session, so
# `import honestapply` and `import dashboard` resolve the same way regardless of
# how pytest is launched (console script vs `python -m`) or whether the package
# is installed editable. Without this, dashboard/ — which is not part of the
# installed wheel — is importable under `python -m pytest` but not under CI's
# `pytest`.
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Selected explicitly rather than inheriting ruff's default set, because that
# default expands between ruff minor versions (0.16 added E501 and the bandit/
# blind-except families), which silently turned CI red on an unrelated bump.
# This is the set the code is written against: pyflakes, the pycodestyle error
# subset minus line-length, and import sorting. Widen it deliberately, in a
# commit that also fixes whatever it newly flags — never as a side effect of a
# version bump. `ruff` is pinned in the dev extra for the same reason.
select = ["E4", "E7", "E9", "F", "I"]
